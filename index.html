<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#08111f"
    >

    <title>Işık Yolları</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >
</head>


<body>

    <main class="game">

        <!-- ÜST BİLGİ -->

        <header class="top-bar">

            <div class="brand">

                <div class="brand-icon">
                    ✦
                </div>

                <div>

                    <h1>
                        IŞIK YOLLARI
                    </h1>

                    <span>
                        Mantık Bulmacası
                    </span>

                </div>

            </div>


            <div class="level-box">

                <span>
                    BÖLÜM
                </span>

                <strong id="levelNumber">
                    1
                </strong>

            </div>

        </header>

<div class="menu-row">

    <button id="shopButton" type="button">
        🏪 Mağaza
    </button>

    <div class="coin-display">
        🪙 <span id="menuGold">0</span>
    </div>

</div>
        
        <!-- OYUN ALANI -->

        <section class="game-panel">

            <div class="game-info">

    <div>
        <span>IŞIK</span>
        <strong id="lightStatus">0%</strong>
    </div>

    <div>
        <span>HAMLE</span>
        <strong id="moveCount">0</strong>
    </div>

    <div>
        <span>ALTIN</span>
        <strong id="goldCount">0 🪙</strong>
    </div>

</div>

<div class="hint-area">

    <button id="hintButton" type="button">
        💡 İPUCU
        <span>100 🪙</span>
    </button>

</div>


            <!-- BULMACA TAHTASI -->

            <div
                id="puzzleBoard"
                class="puzzle-board"
                aria-label="Işık yolu bulmacası"
            >

                <!-- Parçalar JavaScript ile oluşturulacak -->

            </div>


            <div
                id="message"
                class="message"
                aria-live="polite"
            >
                Parçaları döndür ve ışığı hedefe ulaştır.
            </div>


            <div class="controls">

                <button
                    id="resetButton"
                    type="button"
                >
                    ↻ Yeniden Başlat
                </button>

            </div>

        </section>

        <div id="shopModal" class="shop-modal" hidden>

    <div class="shop-box">

        <div class="shop-header">
            <h2>🏪 MAĞAZA</h2>

            <button id="closeShop" type="button">
                ✕
            </button>
        </div>

        <div class="shop-gold">
            🪙 <span id="shopGold">0</span>
        </div>

        <h3>🎨 Tahta Temaları</h3>

        <div class="shop-items">

            <button class="shop-item"
                    data-item="neon"
                    data-price="300">
                🌌
                <strong>Neon</strong>
                <span>300 🪙</span>
            </button>

            <button class="shop-item"
                    data-item="ocean"
                    data-price="500">
                🌊
                <strong>Okyanus</strong>
                <span>500 🪙</span>
            </button>

            <button class="shop-item"
                    data-item="fire"
                    data-price="750">
                🔥
                <strong>Volkan</strong>
                <span>750 🪙</span>
            </button>

        </div>

        <h3>💡 Işıklar</h3>

        <div class="shop-items">

            <button class="shop-item"
                    data-item="blueLight"
                    data-price="400">
                🔵
                <strong>Mavi Enerji</strong>
                <span>400 🪙</span>
            </button>

            <button class="shop-item"
                    data-item="purpleLight"
                    data-price="600">
                🟣
                <strong>Mor Enerji</strong>
                <span>600 🪙</span>
            </button>

            <button class="shop-item"
                    data-item="electricLight"
                    data-price="900">
                ⚡
                <strong>Elektrik</strong>
                <span>900 🪙</span>
            </button>

        </div>

    </div>

        </div>


        <!-- ALT BİLGİ -->

        <footer class="bottom-bar">

            <div class="stat">

                <span>
                    BÖLÜM
                </span>

                <strong id="completedLevel">
                    1
                </strong>

            </div>


            <div class="stat">

                <span>
                    HAMLE
                </span>

                <strong id="totalMoves">
                    0
                </strong>

            </div>


            <div class="stat">

                <span>
                    ⭐
                </span>

                <strong id="stars">
                    0
                </strong>

            </div>

        </footer>

    </main>


    <!-- OYUN MOTORU -->

    <script src="./game.js"></script>

</body>

</html>
