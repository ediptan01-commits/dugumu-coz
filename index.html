<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1020">

    <title>Düğümü Çöz</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <main class="game">

        <header class="top-bar">

            <div class="logo">
                DÜĞÜMÜ ÇÖZ
            </div>

            <div class="level">
                BÖLÜM
                <span id="levelNumber">1</span>
            </div>

        </header>


        <section class="game-area">

            <div class="instructions">
                İpleri sürükle ve düğümü çöz.
            </div>

            <canvas
                id="gameCanvas"
                aria-label="Düğüm çözme oyun alanı">
            </canvas>

        </section>


        <footer class="bottom-bar">

            <div class="stat">

                HAMLE

                <strong id="moveCount">
                    0
                </strong>

            </div>


            <div class="stat">

                KESİŞME

                <strong id="crossingCount">
                    1
                </strong>

            </div>


            <button
                id="resetButton"
                type="button">

                YENİDEN BAŞLAT

            </button>

        </footer>

    </main>


    <script src="./game.js"></script>

</body>
</html>
