<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#08111f"
    >

    <title>Işık Yolları</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >
</head>


<body>

    <main class="game">

        <!-- ÜST BİLGİ -->

        <header class="top-bar">

            <div class="brand">

                <div class="brand-icon">
                    ✦
                </div>

                <div>

                    <h1>
                        IŞIK YOLLARI
                    </h1>

                    <span>
                        Mantık Bulmacası
                    </span>

                </div>

            </div>


            <div class="level-box">

                <span>
                    BÖLÜM
                </span>

                <strong id="levelNumber">
                    1
                </strong>

            </div>

        </header>


        <!-- OYUN ALANI -->

        <section class="game-panel">

            <div class="game-info">

                <div>

                    <span>
                        IŞIK
                    </span>

                    <strong id="lightStatus">
                        KAPALI
                    </strong>

                </div>


                <div>

                    <span>
                        HAMLE
                    </span>

                    <strong id="moveCount">
                        0
                    </strong>

                </div>

            </div>


            <!-- BULMACA TAHTASI -->

            <div
                id="puzzleBoard"
                class="puzzle-board"
                aria-label="Işık yolu bulmacası"
            >

                <!-- Parçalar JavaScript ile oluşturulacak -->

            </div>


            <div
                id="message"
                class="message"
                aria-live="polite"
            >
                Parçaları döndür ve ışığı hedefe ulaştır.
            </div>


            <div class="controls">

                <button
                    id="resetButton"
                    type="button"
                >
                    ↻ Yeniden Başlat
                </button>

            </div>

        </section>


        <!-- ALT BİLGİ -->

        <footer class="bottom-bar">

            <div class="stat">

                <span>
                    BÖLÜM
                </span>

                <strong id="completedLevel">
                    1
                </strong>

            </div>


            <div class="stat">

                <span>
                    HAMLE
                </span>

                <strong id="totalMoves">
                    0
                </strong>

            </div>


            <div class="stat">

                <span>
                    ⭐
                </span>

                <strong id="stars">
                    0
                </strong>

            </div>

        </footer>

    </main>


    <!-- OYUN MOTORU -->

    <script src="./game.js"></script>

</body>

</html>
